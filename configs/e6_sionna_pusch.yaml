# E6 — Sionna 5G NR PUSCH with CDL-A/C, LDPC + TB-CRC, 30/60/120 km/h, gate G2 on the real TB CRC.
# GPU only; see citadel_rx/channels/sionna_pusch.py (status: not exercised on CPU).
channel: {model: sionna_pusch, n_user: 4, n_ant: 4, snr_db: 10.0}
frame: {n_blocks: 200}
receiver: {type: citadel, epochs: 300, pretrain: true}
citadel: {levels: 3, periods: [1, 8, 32], fast_rule: dgd, gates: [g1, g2, g3]}
attack: {type: a1, sir_db: 0.0, start_block: 60, end_block: 140}
run: {name: e6_citadel_cdlA_30kmh, out_dir: results/e6, seeds: [0, 1, 2]}
