# E2 — clean performance of every receiver across Doppler (fading modes) and SNR.
# Sweep receiver.type over all receivers; channel.fading in {cosine, jakes}; channel.jakes_fd_tb in
# {0.01, 0.05, 0.1}; channel.snr_db in {4,...,16}.
channel: {model: synthetic, linear: true, fading: cosine, snr_db: 10.0}
frame: {pilot_bits: 200, data_bits: 50000, n_blocks: 100}
receiver: {type: citadel, epochs: 300, pretrain: true}
citadel: {levels: 3, periods: [1, 8, 32], fast_rule: dgd, dgd_delta: 0.1, gates: [g1, g2, g3]}
attack: {type: none}
run: {name: e2_citadel_clean, out_dir: results/e2, seeds: [0, 1, 2]}
